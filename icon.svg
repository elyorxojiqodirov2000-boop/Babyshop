<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B30FF"/>
      <stop offset="100%" style="stop-color:#6000CC"/>
    </linearGradient>
  </defs>
  
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bg)"/>
  
  <!-- Top white band: BIZ MIX -->
  <rect x="40" y="55" width="432" height="90" rx="12" fill="white" opacity="0.95"/>
  <text x="256" y="118" font-family="Arial Black, sans-serif" font-size="62" font-weight="900" 
        fill="#6000CC" text-anchor="middle" letter-spacing="4">BIZ MIX</text>
  
  <!-- Shopping cart icon (white) -->
  <!-- Handle -->
  <path d="M80 195 Q80 165 110 165 L155 165" stroke="white" stroke-width="18" fill="none" stroke-linecap="round"/>
  <!-- Cart body -->
  <rect x="155" y="155" width="200" height="130" rx="8" fill="none" stroke="white" stroke-width="18"/>
  <!-- Cart lines inside -->
  <line x1="155" y1="200" x2="355" y2="200" stroke="white" stroke-width="12"/>
  <!-- Wheels -->
  <circle cx="195" cy="320" r="28" fill="none" stroke="white" stroke-width="18"/>
  <circle cx="195" cy="320" r="8" fill="white"/>
  <circle cx="315" cy="320" r="28" fill="none" stroke="white" stroke-width="18"/>
  <circle cx="315" cy="320" r="8" fill="white"/>
  <!-- Price tag -->
  <rect x="240" y="165" width="115" height="38" rx="6" fill="#FFD700"/>
  <text x="297" y="192" font-family="Arial, sans-serif" font-size="22" font-weight="800" 
        fill="#5500AA" text-anchor="middle">BUYURTMA</text>
  
  <!-- Bottom yellow band: GROUP -->
  <rect x="40" y="368" width="432" height="88" rx="12" fill="#FFD700"/>
  <text x="256" y="428" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" 
        fill="#5500AA" text-anchor="middle" letter-spacing="2">GROUP</text>
</svg>
